# Kept out of the published crate on purpose: the tree-sitter grammars are C,
# and weavatrix-parse forbids unsafe and carries no dependencies. This is its
# own workspace so nothing here can leak into the library's lockfile.
[workspace]

[package]
name = "competitor-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
tree-sitter = "0.26.11"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-typescript = "0.23.2"
weavatrix-parse = { path = "../.." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
